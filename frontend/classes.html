<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Classes</title>
        <link rel="stylesheet" href="style.css">
    </head>

<body>
        <h1>Classes</h1>

        <ul id="class-list"></ul>

        <h2>Add a New Class</h2>
        <form id="add-class-form">
            <label for="branch-select">Branch:</label>
            <select id="branch-select" required>
                <option value="">-- Select a branch --</option>
            </select>
            <br><br>

            <label for="trainer-select">Trainer:</label>
            <select id="trainer-select" required>
                <option value="">-- Select a trainer --</option>
            </select>
            <br><br>

            <label for="name-input">Class_Name:</label>
            <input type="text" id="name-input" required>
            <br><br>

            <label for="schedule-input">Schedule_Time:</label>
            <input type="datetime-local" id="schedule-input" required>
            <br><br>

            <label for="duration-input">Duration:</label>
            <input type="number" id="duration-input" required>
            <br><br>

            <label for="capacity-input">Capacity:</label>
            <input type="number" id="capacity-input" required>
            <br><br>    

            <button type="submit">Add Class</button>
        </form>

    <script>
        function loadClasses(){
            const list = document.getElementById("class-list");
            list.innerHTML = "";

            fetch("http://127.0.0.1:5000/classes")
                .then(response => response.json())
                .then(data => {
                    data.forEach(gymClass => {
                        const item = document.createElement("li");
                        const text = document.createElement("span");
                        text.textContent = gymClass.class_name + " - " + gymClass.schedule_time;
                        item.appendChild(text);
                        list.appendChild(item);
                    });
                });
        }

        loadClasses();

        fetch("http://127.0.0.1:5000/branches")
            .then(response => response.json())
            .then(branches => {
                const select = document.getElementById("branch-select");
                branches.forEach(branch => {
                    const option = document.createElement("option");
                    option.value = branch.branch_id;
                    option.textContent = branch.name;
                    select.appendChild(option);
                });
            });

        fetch("http://127.0.0.1:5000/trainers")
            .then(response => response.json())
            .then(trainers => {
                const select = document.getElementById("trainer-select");
                trainers.forEach(trainer => {
                    const option = document.createElement("option");
                    option.value = trainer.trainer_id;
                    option.textContent = trainer.name;
                    select.appendChild(option);
                });
            });

        const form = document.getElementById("add-class-form");
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const newClass = {
                branch_id: document.getElementById("branch-select").value,
                trainer_id: document.getElementById("trainer-select").value,
                class_name: document.getElementById("name-input").value,
                schedule_time: document.getElementById("schedule-input").value,
                duration_minutes: document.getElementById("duration-input").value,
                capacity: document.getElementById("capacity-input").value
            };

            fetch("http://127.0.0.1:5000/classes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(newClass)
            })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    form.reset();
                    loadClasses();
                });
        });
    </script>
</body>
</html>
