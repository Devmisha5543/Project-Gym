<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Manager Dashboard</h1>

    <h2>Memberships Expiring Soon</h2>
    <ul id="expiring-list"></ul>

    <script>
        fetch("http://127.0.0.1:5000/memberships/expiring")
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("expiring-list");

                if (data.length === 0) {
                    const item = document.createElement("li");
                    item.textContent = "No memberships expiring in the next 7 days.";
                    list.appendChild(item);
                    return;
                }

                data.forEach(membership => {
                    const item = document.createElement("li");
                    item.textContent = membership.member_name + " (" + membership.member_phone + ") - expires " + membership.end_date;
                    list.appendChild(item);
                });
            });
    </script>
</body>
</html>
