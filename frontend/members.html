<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gym Members</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Members</h1>

    <ul id="member-list"></ul>

    <h2>Add a New Member</h2>
    <form id="add-member-form">
        <label for="branch-select">Branch:</label>
        <select id="branch-select" required>
            <option value="">-- Select a branch --</option>
        </select>
        <br><br>

        <label for="name-input">Name:</label>
        <input type="text" id="name-input" required>
        <br><br>

        <label for="gender-select">Gender:</label>
        <select id="gender-select" required>
            <option value="">-- Select --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <br><br>

        <label for="phone-input">Phone:</label>
        <input type="text" id="phone-input" required>
        <br><br>

        <label for="address-input">Address:</label>
        <input type="text" id="address-input" required>
        <br><br>

        <label for="join-date">Join Date:</label>
        <input type="date" id="join-date" required>
        <br><br>

        <label for="wants-trainer">Wants a Trainer?</label>
        <input type="checkbox" id="wants-trainer">
        <br><br>

        <label for="photo-input">Photo:</label>
        <input type="file" id="photo-input" accept="image/*">
        <br><br>

        <button type="submit">Add Member</button>
    </form>

    <script>
        function loadMembers() {
            const list = document.getElementById("member-list");
            list.innerHTML = "";

            fetch("http://127.0.0.1:5000/members")
                .then(response => response.json())
                .then(data => {
                    data.forEach(member => {
                        const item = document.createElement("li");

                        if (member.photo_filename) {
                            const img = document.createElement("img");
                            img.src = "http://127.0.0.1:5000/uploads/" + member.photo_filename;
                            img.style.width = "40px";
                            img.style.height = "40px";
                            img.style.borderRadius = "50%";
                            img.style.marginRight = "10px";
                            img.style.verticalAlign = "middle";
                            item.appendChild(img);
                        }

                        const text = document.createElement("span");
                        text.textContent = member.name + " - " + member.phone;
                        item.appendChild(text);
                        list.appendChild(item);
                    });
                });
        }

        loadMembers();

        fetch("http://127.0.0.1:5000/branches")
            .then(response => response.json())
            .then(branches => {
                const select = document.getElementById("branch-select");
                branches.forEach(branch => {
                    const option = document.createElement("option");
                    option.value = branch.branch_id;
                    option.textContent = branch.name;
                    select.appendChild(option);
                });
            });

        document.getElementById("join-date").valueAsDate = new Date();

        const form = document.getElementById("add-member-form");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append("branch_id", document.getElementById("branch-select").value);
            formData.append("name", document.getElementById("name-input").value);
            formData.append("gender", document.getElementById("gender-select").value);
            formData.append("phone", document.getElementById("phone-input").value);
            formData.append("address", document.getElementById("address-input").value);
            formData.append("join_date", document.getElementById("join-date").value);
            formData.append("wants_trainer", document.getElementById("wants-trainer").checked);

            const photoFile = document.getElementById("photo-input").files[0];
            if (photoFile) {
                formData.append("photo", photoFile);
            }

            fetch("http://127.0.0.1:5000/members", {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    form.reset();
                    document.getElementById("join-date").valueAsDate = new Date();
                    loadMembers();
                });
        });
    </script>
</body>
</html>
